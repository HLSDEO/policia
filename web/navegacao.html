<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Histórico de navegação · PolícIA</title>
<script src="js/utils/boot_tema.js"></script>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/entidades.css">
<link rel="stylesheet" href="css/arquivos.css">
<link rel="stylesheet" href="css/ufdr.css">
<link rel="stylesheet" href="css/caso_graficos.css">
<link rel="stylesheet" href="css/chat.css">
<link rel="stylesheet" href="css/ia_flutuante.css">
</head>
<body>
<div class="app">

  <div class="main" style="width:100%;">
    <header class="topbar">
      <h1 class="page-title">Histórico de navegação</h1>
      <div class="topbar-actions">
        <span class="grupo-total" id="total-registros"></span>
        <span class="extracao-nav-container"></span>
      </div>
    </header>

    <main class="content">

      <div class="card" style="max-width:none; margin-bottom:16px;">
        <div id="abas-host"></div>
      </div>

      <div id="painel-historico">

      <div class="kpi-tiles" id="nav-kpis" style="margin-bottom:16px;">
        <div class="card kpi-tile">
          <div class="card-stat" id="kpi-total-visitas">—</div>
          <div class="card-stat-label">visitas registradas</div>
        </div>
        <div class="card kpi-tile">
          <div class="card-stat" id="kpi-total-paginas">—</div>
          <div class="card-stat-label">páginas no histórico</div>
        </div>
        <div class="card kpi-tile">
          <div class="card-stat" id="kpi-sites-unicos">—</div>
          <div class="card-stat-label">sites únicos</div>
        </div>
        <div class="card kpi-tile">
          <div class="card-stat" id="kpi-navegadores">—</div>
          <div class="card-stat-label">navegadores</div>
        </div>
        <div class="card kpi-tile">
          <div class="card-stat" id="kpi-contas">—</div>
          <div class="card-stat-label">contas distintas</div>
        </div>
        <div class="card kpi-tile">
          <div class="card-stat" id="kpi-periodo" style="font-size:16px;">—</div>
          <div class="card-stat-label">período coberto</div>
        </div>
      </div>

      <div class="card" style="margin-bottom:16px; max-width:none;">
        <h2>Sites mais acessados</h2>
        <div id="nav-top-sites"></div>
        <p class="empty-hint hidden" id="nav-top-sites-vazio">Nenhum site identificado nos registros filtrados.</p>
      </div>

      <div class="row-2col" style="margin-bottom:16px;">
        <div class="card">
          <h2>Navegadores mais usados</h2>
          <div id="nav-por-navegador"></div>
          <p class="empty-hint hidden" id="nav-por-navegador-vazio">Nenhum registro.</p>
        </div>
        <div class="card">
          <h2>Visitas por período do dia</h2>
          <div id="nav-por-periodo"></div>
          <p class="empty-hint hidden" id="nav-por-periodo-vazio">Nenhum registro.</p>
        </div>
      </div>

      <div class="card" style="max-width:none;">

        <div class="arq-filtros">
          <input type="search" id="filtro-busca" class="arq-busca" placeholder="Buscar por título, URL ou conta…" aria-label="Buscar por título, URL ou conta" autocomplete="off">
          <select id="filtro-navegador" class="arq-select">
            <option value="">Todos os navegadores</option>
          </select>
          <select id="filtro-periodo" class="arq-select">
            <option value="">Qualquer horário</option>
            <option value="madrugada">Madrugada (0h–6h)</option>
            <option value="manha">Manhã (6h–12h)</option>
            <option value="tarde">Tarde (12h–18h)</option>
            <option value="noite">Noite (18h–0h)</option>
          </select>
          <select id="filtro-ordenar" class="arq-select">
            <option value="recentes">Ordenar: mais recentes</option>
            <option value="antigos">Ordenar: mais antigos</option>
            <option value="visitas">Ordenar: mais visitadas</option>
            <option value="titulo">Ordenar: título</option>
          </select>
          <label class="arq-datas">De <input type="date" id="filtro-data-de" class="arq-select"></label>
          <label class="arq-datas">Até <input type="date" id="filtro-data-ate" class="arq-select"></label>
        </div>

        <div id="tabela"></div>

      </div>

      </div>
    </main>
  </div>

</div>

<script src="vendor/jquery-3.7.1.min.js"></script>
<script src="js/utils/utils.js"></script>
<script src="js/utils/icones.js"></script>
<script src="js/utils/mapa_telas.js"></script>
<script src="js/utils/toast.js"></script>
<script src="js/utils/api.js"></script>
<script src="js/utils/carregando.js"></script>
<script src="js/utils/estados.js"></script>
<script src="js/utils/estado_url.js"></script>
<script src="js/utils/dialogo.js"></script>
<script src="js/utils/theme.js"></script>
<script src="js/utils/sidebar.js"></script>
<script src="js/utils/auth.js"></script>
<script src="js/utils/avisos_ia.js"></script>
<script src="js/utils/entidades.js"></script>
<script src="js/utils/exportar_excel.js"></script>
<script src="js/utils/navegacao_inquerito.js"></script>
<script src="js/utils/tabela_paginada.js"></script>
<script src="js/utils/velocidade_midia.js"></script>
<script src="js/utils/ufdr_dominio.js"></script>
<script src="js/navegacao.js"></script>
<script src="js/utils/doc_trecho.js"></script>
<script src="js/utils/evidencia_info.js"></script>
<script src="js/utils/ia_flutuante.js"></script>
</body>
</html>
