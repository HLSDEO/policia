<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comparar rosto · PolícIA</title>
<script src="js/utils/boot_tema.js"></script>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/comparar_rosto.css">
</head>
<body>
<div class="app">

  <div class="main">
    <header class="topbar">
      <h1 class="page-title">Comparar rosto</h1>
      <div class="topbar-actions">
        <span class="card-hint" id="header-hint"></span>
        <span class="extracao-nav-container"></span>
      </div>
    </header>

    <main class="content">

      <div class="card card-cheia">
        <h2>Upload da imagem de referência</h2>
        <p class="card-hint">Envie uma foto com um rosto para buscar correspondências nas imagens do inquérito.</p>

        <form id="upload-form" autocomplete="off">
          <div class="cmp-campos">
            <div class="field">
              <label for="inquerito-select">Inquérito</label>
              <select id="inquerito-select"></select>
              <div class="field-help" id="inquerito-help"></div>
            </div>

            <div class="field">
              <label for="extracao-select">Aparelho</label>
              <select id="extracao-select"></select>
              <div class="field-help" id="extracao-help">A varredura roda em todas as imagens do inquérito.</div>
            </div>

            <div class="field">
              <label for="limite-select">Exibir até</label>
              <select id="limite-select">
                <option value="20">20 resultados</option>
                <option value="50" selected>50 resultados</option>
                <option value="100">100 resultados</option>
              </select>
              <p class="field-help">Os mais parecidos; o servidor aceita no máximo 100.</p>
            </div>
          </div>

          <div class="field">
            <label id="drop-zone" class="drop-zone drop-zone-compacta">
              <span id="drop-text">Arraste uma imagem aqui ou clique para selecionar</span>
              <input type="file" id="file-input" accept="image/*" class="sr-only">
            </label>
            <div id="preview-wrap" class="hidden">
              <img id="preview-img" alt="Prévia da imagem de referência enviada">
              <div>
                <button type="button" class="btn btn-secondary" id="trocar-img-btn">Trocar imagem</button>
              </div>
            </div>
            <p class="field-help" id="file-help" role="alert"></p>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="comparar-btn" disabled>
              <span id="comparar-icone"></span>Comparar rostos
            </button>
            <button type="button" class="btn btn-secondary hidden" id="cancelar-btn">Cancelar</button>
            <span class="form-status" id="form-status" role="status" aria-live="polite"></span>
          </div>
        </form>
      </div>

      <div id="resultados-wrap" class="hidden">
        <div class="card card-cheia">
          <h2>Resultados <span id="resultados-count" class="badge badge-ok"></span></h2>
          <p class="card-hint" id="resultados-hint"></p>

          <div class="cmp-filtros hidden" id="cmp-filtros">
            <label class="cmp-filtro">
              <span class="cmp-filtro-rotulo">Buscar</span>
              <input type="search" id="filtro-busca" placeholder="nome ou caminho do arquivo" aria-label="Buscar por nome ou caminho do arquivo">
            </label>
            <label class="cmp-filtro">
              <span class="cmp-filtro-rotulo">Similaridade mínima</span>
              <select id="filtro-similaridade" aria-label="Similaridade mínima exibida">
                <option value="0">Todas</option>
                <option value="60">60% ou mais</option>
                <option value="80">80% ou mais</option>
              </select>
            </label>
            <label class="cmp-filtro">
              <span class="cmp-filtro-rotulo">Ordenar</span>
              <select id="filtro-ordenar" aria-label="Ordenar resultados">
                <option value="similaridade">Mais parecidas primeiro</option>
                <option value="nome">Por nome</option>
                <option value="arquivo">Por arquivo de origem</option>
              </select>
            </label>
            <span class="cmp-filtro-info" id="filtro-info"></span>
          </div>

          <div id="resultados-lista"></div>
        </div>
      </div>

    </main>
  </div>

</div>

<div class="modal-overlay hidden" id="modal-origem" role="dialog" aria-modal="true" aria-labelledby="origem-titulo">
  <div class="modal modal-origem">
    <div class="modal-header">
      <h2 id="origem-titulo">Detalhes da origem</h2>
      <button type="button" class="modal-close" id="origem-fechar" aria-label="Fechar detalhes da origem">&times;</button>
    </div>
    <div class="modal-body" id="origem-conteudo"></div>
  </div>
</div>

<div class="modal-overlay hidden" id="modal-midia" role="dialog" aria-modal="true" aria-labelledby="midia-titulo">
  <div class="modal modal-midia">
    <div class="modal-header">
      <h2 id="midia-titulo">Imagem encontrada</h2>
      <button type="button" class="modal-close" id="midia-fechar" aria-label="Fechar imagem">&times;</button>
    </div>
    <div class="modal-body" id="midia-conteudo"></div>
  </div>
</div>

<script src="vendor/jquery-3.7.1.min.js"></script>
<script src="js/utils/utils.js"></script>
<script src="js/utils/icones.js"></script>
<script src="js/utils/mapa_telas.js"></script>
<script src="js/utils/toast.js"></script>
<script src="js/utils/api.js"></script>
<script src="js/utils/carregando.js"></script>
<script src="js/utils/estados.js"></script>
<script src="js/utils/estado_url.js"></script>
<script src="js/utils/dialogo.js"></script>
<script src="js/utils/theme.js"></script>
<script src="js/utils/sidebar.js"></script>
<script src="js/utils/auth.js"></script>
<script src="js/utils/avisos_ia.js"></script>
<script src="js/utils/exportar_excel.js"></script>
<script src="js/utils/navegacao_inquerito.js"></script>
<script src="js/comparar_rosto.js"></script>
</body>
</html>
