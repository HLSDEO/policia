<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Documentação de código · PolícIA</title>
<script src="js/utils/boot_tema.js"></script>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/documentacao.css">
</head>
<body>
<div class="app">

  <div class="main">
    <header class="topbar">
      <h1 class="page-title">Documentação de código</h1>
    </header>

    <main class="content">
      <div class="doc-layout" id="doc-layout">

        <aside class="doc-painel" aria-label="Documentos">
          <div class="doc-busca-wrap">
            <input type="search" id="doc-busca" class="doc-busca" placeholder="Buscar por título ou conteúdo…"
                   autocomplete="off" aria-label="Buscar na documentação">
          </div>
          <div class="doc-lista" id="doc-lista" role="list"></div>
        </aside>

        <article class="doc-conteudo card hidden" id="doc-conteudo">
          <header class="doc-cabecalho">
            <h2 class="doc-titulo" id="doc-titulo"></h2>
            <p class="doc-meta card-hint" id="doc-meta"></p>
          </header>

          <nav class="doc-sumario hidden" id="doc-sumario" aria-label="Nesta página">
            <span class="doc-sumario-rotulo">Nesta página</span>
            <div class="doc-sumario-lista" id="doc-sumario-lista"></div>
          </nav>

          <div class="doc-corpo md" id="doc-corpo"></div>
        </article>
      </div>

      <p class="empty-hint hidden" id="sem-permissao-hint">Esta página é só para administradores.</p>
    </main>
  </div>

</div>

<script src="vendor/jquery-3.7.1.min.js"></script>
<script src="js/utils/utils.js"></script>
<script src="js/utils/icones.js"></script>
<script src="js/utils/mapa_telas.js"></script>
<script src="js/utils/toast.js"></script>
<script src="js/utils/api.js"></script>
<script src="js/utils/carregando.js"></script>
<script src="js/utils/estados.js"></script>
<script src="js/utils/estado_url.js"></script>
<script src="js/utils/dialogo.js"></script>
<script src="js/utils/theme.js"></script>
<script src="js/utils/sidebar.js"></script>
<script src="js/utils/auth.js"></script>
<script src="js/utils/avisos_ia.js"></script>
<script src="js/utils/markdown.js"></script>
<script src="js/documentacao.js"></script>
</body>
</html>
