<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar · PolícIA</title>
<script src="js/utils/boot_tema.js"></script>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/login.css">
<link rel="stylesheet" href="css/home_orbit.css">
</head>
<body>

<div class="login-tela">
  <div class="home-radar-background" aria-hidden="true">
    <svg class="home-radar-layer home-radar-network" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" focusable="false"></svg>
  </div>
  <div class="login-card">
    <div class="login-brand">
      <span class="brand-mark"><img src="img/logo-mark.png" alt="PolícIA"></span>
      <span class="brand-name"><span class="brand-polic">Políc</span><span class="brand-ia">IA</span></span>
    </div>
    <p class="card-hint">Entre com suas credenciais.</p>

    <!-- Preenchido por js/login.js a partir de GET /api/auth/provedores. Fica escondido quando
         há uma forma de autenticação só — não faz sentido pedir escolha onde não há escolha. -->
    <div class="login-provedores hidden" id="login-provedores" role="group" aria-label="Forma de autenticação"></div>

    <p class="login-provedor-aviso hidden" id="login-aviso"></p>

    <form id="login-form" autocomplete="off">
      <div class="field">
        <label for="login-input">Login</label>
        <input type="text" id="login-input" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="senha-input">Senha</label>
        <input type="password" id="senha-input" autocomplete="current-password" required>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary" id="login-btn" style="width:100%; justify-content:center;">Entrar</button>
      </div>
      <p class="form-status" id="login-status"></p>
    </form>

    <p class="card-hint" style="margin-top:16px; margin-bottom:0;">
      <a href="redefinir_senha.html" style="color:var(--accent);">Esqueci minha senha</a>
    </p>
    <p class="card-hint" style="margin-top:6px; margin-bottom:0;">
      Não tem conta? <a href="cadastro.html" style="color:var(--accent);">Criar conta</a>
    </p>
  </div>
  <button class="home-motion-toggle" type="button" aria-pressed="false" hidden>Pausar fundo</button>
</div>

<script src="vendor/jquery-3.7.1.min.js"></script>
<script src="js/utils/utils.js"></script>
<script src="js/utils/icones.js"></script>
<script src="js/utils/mapa_telas.js"></script>
<script src="js/utils/toast.js"></script>
<script src="js/utils/api.js"></script>
<script src="js/utils/carregando.js"></script>
<script src="js/utils/estados.js"></script>
<script src="js/utils/estado_url.js"></script>
<script src="js/utils/dialogo.js"></script>
<script src="js/utils/theme.js"></script>
<script src="js/utils/primeiro_acesso.js"></script>
<script src="js/login.js"></script>
<script src="js/home_radar_orbit.js"></script>
</body>
</html>
