<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Documento · PolícIA</title>
<script src="js/utils/boot_tema.js"></script>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/documento.css">
<link rel="stylesheet" href="css/chat.css">
<link rel="stylesheet" href="css/ia_flutuante.css">
</head>
<body>

<div class="doc-app">
  <!-- Sumário: uma linha por página, com prévia. É por ele que se anda num PDF de centenas de
       folhas sem rolar o texto inteiro. -->
  <aside class="doc-sumario" id="doc-sumario" aria-label="Sumário do documento">
    <div class="doc-sumario-topo">
      <div class="doc-sumario-titulo">
        <span id="doc-sumario-rotulo">Páginas</span>
        <span class="doc-sumario-contagem" id="doc-sumario-contagem"></span>
      </div>
      <div class="doc-busca">
        <span class="doc-busca-icone" aria-hidden="true">🔍</span>
        <input type="search" id="doc-busca" placeholder="Buscar no documento… (Enter navega)"
               autocomplete="off" aria-label="Buscar no documento">
      </div>
      <div class="doc-busca-info" id="doc-busca-info" aria-live="polite"></div>
      <button type="button" class="doc-busca-filtro hidden" id="doc-busca-filtro"></button>
    </div>
    <div class="doc-sumario-lista" id="doc-sumario-lista"></div>
  </aside>

  <div class="doc-principal">
    <header class="topbar doc-topbar">
      <div class="doc-cabecalho">
        <h1 class="page-title" id="doc-nome">Documento</h1>
        <div class="doc-meta" id="doc-meta"></div>
      </div>
      <div class="topbar-actions">
        <button type="button" class="btn btn-secondary" id="doc-reextrair"
                title="Relê o arquivo original e regrava o texto extraído">Reextrair</button>
        <a class="btn btn-secondary" id="doc-original" target="_blank" rel="noopener"
           title="Abre o arquivo original numa aba nova">Original</a>
        <!-- Modos de leitura: PDF até 300 páginas (o arquivo inteiro vai para o navegador, e o
             scroll sincronizado só vale quando o texto é paginado); "Formatado" é do .docx
             (blocos estruturados do backend, substituindo o <pre>); "Renderizado" é do .html
             (o original num iframe sem scripts). A visibilidade de cada botão é do JS. -->
        <span class="doc-modo-ctrl hidden" id="doc-modo" role="group" aria-label="Modo de leitura">
          <button type="button" data-modo="texto" title="Só o texto extraído (como sempre)">Texto</button>
          <button type="button" data-modo="pdf" title="Só o PDF, renderizado nesta tela">PDF</button>
          <button type="button" data-modo="lado" title="Texto e PDF lado a lado, com o scroll acompanhando a página">Lado a lado</button>
          <button type="button" class="hidden" data-modo="formatado"
                  title="O Word como ele se lê: títulos, listas e tabelas de verdade">Formatado</button>
          <button type="button" class="hidden" data-modo="renderizado"
                  title="O HTML original renderizado, sem executar nada dele">Renderizado</button>
        </span>
        <span class="doc-fonte-ctrl" role="group" aria-label="Tamanho do texto">
          <button type="button" id="doc-fonte-menos" title="Diminuir o tamanho do texto"
                  aria-label="Diminuir o tamanho do texto">A−</button>
          <button type="button" id="doc-fonte-mais" title="Aumentar o tamanho do texto"
                  aria-label="Aumentar o tamanho do texto">A+</button>
        </span>
        <span class="extracao-nav-container"></span>
      </div>
    </header>

    <!-- Barra da citação: só aparece quando se chegou aqui por um clique no chat da IA. -->
    <div class="doc-citacao hidden" id="doc-citacao">
      <span class="doc-citacao-rotulo" id="doc-citacao-rotulo"></span>
      <span class="doc-citacao-texto" id="doc-citacao-texto"></span>
      <span class="doc-citacao-nav hidden" id="doc-citacao-nav">
        <button type="button" id="doc-trecho-anterior" title="Ocorrência anterior"
                aria-label="Ocorrência anterior">‹</button>
        <span id="doc-trecho-posicao" aria-live="polite"></span>
        <button type="button" id="doc-trecho-proximo" title="Próxima ocorrência"
                aria-label="Próxima ocorrência">›</button>
      </span>
      <button type="button" class="doc-citacao-fechar" id="doc-citacao-fechar"
              aria-label="Dispensar">&times;</button>
    </div>

    <div class="doc-aviso hidden" id="doc-aviso"></div>

    <main class="doc-conteudo" id="doc-conteudo">
      <div class="doc-painel ativo" id="doc-painel-texto">
        <div id="doc-folhas"></div>
      </div>
      <!-- Painel do PDF (js/documento_pdf.js): uma <section> por página, canvas desenhado sob
           demanda quando a folha entra na tela. Só recebe conteúdo no primeiro modo PDF. -->
      <div class="doc-painel doc-painel-pdf" id="doc-painel-pdf" aria-label="PDF do documento">
        <div id="doc-pdf-folhas"></div>
      </div>
      <!-- Painel do HTML renderizado: srcdoc + sandbox vazio = o documento é lido como página,
           mas sem scripts, formulários nem quadros dele mesmos. O nginx manda
           X-Frame-Options: DENY, e mesmo assim isto funciona porque srcdoc não é busca na rede. -->
      <div class="doc-painel doc-painel-render" id="doc-painel-render" aria-label="HTML renderizado">
        <iframe id="doc-render-iframe" sandbox="" title="HTML original renderizado"></iframe>
      </div>
    </main>
  </div>
</div>

<script src="vendor/jquery-3.7.1.min.js"></script>
<script src="js/utils/utils.js"></script>
<script src="js/utils/icones.js"></script>
<script src="js/utils/mapa_telas.js"></script>
<script src="js/utils/toast.js"></script>
<script src="js/utils/api.js"></script>
<script src="js/utils/carregando.js"></script>
<script src="js/utils/estados.js"></script>
<script src="js/utils/dialogo.js"></script>
<script src="js/utils/theme.js"></script>
<script src="js/utils/sidebar.js"></script>
<script src="js/utils/auth.js"></script>
<script src="js/utils/avisos_ia.js"></script>
<script src="js/utils/navegacao_inquerito.js"></script>
<script src="js/utils/doc_trecho.js"></script>
<script src="js/utils/evidencia_info.js"></script>
<script src="vendor/pdfjs/pdf.min.js"></script>
<script src="js/documento_pdf.js"></script>
<script src="js/documento.js"></script>
<script src="js/utils/ia_flutuante.js"></script>
</body>
</html>
