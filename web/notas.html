<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notas · PolícIA</title>
<script src="js/utils/boot_tema.js"></script>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/entidades.css">
<link rel="stylesheet" href="css/arquivos.css">
<link rel="stylesheet" href="css/chat.css">
<link rel="stylesheet" href="css/ia_flutuante.css">
</head>
<body>
<div class="app">

  <div class="main" style="width:100%;">
    <header class="topbar">
      <h1 class="page-title">Notas</h1>
      <div class="topbar-actions">
        <span class="grupo-total" id="total-registros"></span>
        <span class="extracao-nav-container"></span>
      </div>
    </header>

    <main class="content">
      <div class="card" style="max-width:none;">
        <div class="arq-filtros">
          <input type="search" id="filtro-busca" class="arq-busca" placeholder="Buscar por título, conteúdo ou app…" autocomplete="off">
          <select id="filtro-status" class="arq-select">
            <option value="">Todos os status</option>
          </select>
        </div>
        <div style="overflow-x:auto;">
          <table class="grupo-tabela" id="dados-tabela" data-exportar="notas">
            <thead>
              <tr>
                <td class="col-nome">Data</td>
                <td class="col-nome">App</td>
                <td class="col-nome">Título</td>
                <td class="col-nome">Conteúdo</td>
                <td class="col-nome">Status</td>
                <td class="col-nome">Anexos</td>
                <td class="col-nome">Entidade</td>
              </tr>
            </thead>
            <tbody id="dados-corpo"></tbody>
          </table>
        </div>
        <p class="empty-hint" id="dados-vazio" style="display:none;">Nenhuma nota encontrada nesta extração.</p>
      </div>
    </main>
  </div>

</div>

<script src="vendor/jquery-3.7.1.min.js"></script>
<script src="js/utils/utils.js"></script>
<script src="js/utils/icones.js"></script>
<script src="js/utils/mapa_telas.js"></script>
<script src="js/utils/toast.js"></script>
<script src="js/utils/api.js"></script>
<script src="js/utils/carregando.js"></script>
<script src="js/utils/estados.js"></script>
<script src="js/utils/estado_url.js"></script>
<script src="js/utils/destaque_registro.js"></script>
<script src="js/utils/dialogo.js"></script>
<script src="js/utils/theme.js"></script>
<script src="js/utils/sidebar.js"></script>
<script src="js/utils/auth.js"></script>
<script src="js/utils/avisos_ia.js"></script>
<script src="js/utils/entidades.js"></script>
<script src="js/utils/exportar_excel.js"></script>
<script src="js/utils/navegacao_inquerito.js"></script>
<script src="js/utils/ufdr_dominio.js"></script>
<script src="js/notas.js"></script>
<script src="js/utils/doc_trecho.js"></script>
<script src="js/utils/evidencia_info.js"></script>
<script src="js/utils/ia_flutuante.js"></script>
</body>
</html>
