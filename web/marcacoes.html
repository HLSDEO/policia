<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marcações · PolícIA</title>
<script src="js/utils/boot_tema.js"></script>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/entidades.css">
<link rel="stylesheet" href="css/marcacoes.css">
</head>
<body>
<div class="app">

  <div class="main" style="width:100%;">
    <header class="topbar">
      <h1 class="page-title">Marcações</h1>
      <div class="topbar-actions">
        <select id="filtro-fonte" title="Mensageiro — 'Todas' une WhatsApp, SMS e outros mensageiros">
          <option value="todas">Todas as fontes</option>
          <option value="wpp">WhatsApp</option>
          <option value="sms">SMS</option>
          <option value="msg">Outros mensageiros</option>
        </select>
        <button type="button" class="btn btn-secondary" id="btn-exportar-menu" title="Escolhe marcadores, formato (.docx ou Excel) e se traz o fio das conversas">⬇ Exportar</button>
        <span class="extracao-nav-container"></span>
      </div>
    </header>

    <main class="content">
      <!-- Tabs só aparecem no mobile (ver marcacoes.css): alternam as duas colunas -->
      <div class="mrc-tabs" role="tablist" aria-label="Marcações">
        <button type="button" class="mrc-tab ativo" id="tab-marcadores" role="tab" aria-selected="true">Marcadores</button>
        <button type="button" class="mrc-tab" id="tab-itens" role="tab" aria-selected="false">Itens</button>
      </div>

      <div class="mrc-pagina">

        <!-- esquerda: a árvore de marcadores, como o painel do IPED -->
        <aside class="card mrc-coluna-marcadores" id="col-marcadores">
          <div class="mrc-coluna-titulo">
            <h2>Meus marcadores</h2>
            <button type="button" class="btn btn-primary" id="btn-novo-marcador">＋ Novo</button>
          </div>
          <p class="field-help">
            Marcadores são pessoais e valem só dentro deste inquérito: o que você etiqueta não
            aparece na lista de outro investigador.
          </p>
          <input type="search" id="busca-marcadores" class="mrc-busca" placeholder="Filtrar marcadores…" aria-label="Filtrar marcadores">
          <div id="lista-marcadores" role="listbox" aria-label="Marcadores"></div>
        </aside>

        <!-- direita: o que está dentro do marcador escolhido -->
        <section class="card mrc-coluna-itens" id="col-itens">
          <div class="mrc-coluna-titulo mrc-titulo-sticky">
            <h2 id="itens-titulo">Selecione um marcador</h2>
            <span class="grupo-total" id="itens-total"></span>
          </div>

          <div id="itens-acoes" class="mrc-acoes hidden">
            <button type="button" class="btn btn-secondary" id="btn-renomear">Renomear / cor</button>
            <button type="button" class="btn btn-secondary" id="btn-mesclar">Mesclar com…</button>
            <button type="button" class="btn btn-secondary" id="btn-apagar">Apagar marcador</button>
          </div>

          <div id="itens-ferramentas" class="mrc-ferramentas hidden">
            <input type="search" id="busca-itens" class="mrc-busca" placeholder="Buscar em conversas, mensagens, remetentes…" aria-label="Buscar nos itens">
            <select id="filtro-tipo" title="Tipo de item">
              <option value="tudo">Tudo</option>
              <option value="conversas">Só conversas</option>
              <option value="mensagens">Só mensagens</option>
            </select>
            <select id="ordem-itens" title="Ordenação">
              <option value="conversa-az">Conversa A–Z</option>
              <option value="recentes">Mais recentes primeiro</option>
              <option value="mais-msgs">Mais mensagens primeiro</option>
            </select>
            <label class="field-check" title="Mostra só o que tem anexo"><input type="checkbox" id="filtro-anexos"> 📎</label>
            <label class="field-check" title="Mostra só o que tem comentário"><input type="checkbox" id="filtro-comentarios"> 💬</label>
            <button type="button" class="btn btn-secondary" id="btn-expandir" title="Expande todas as conversas">Expandir</button>
            <button type="button" class="btn btn-secondary" id="btn-recolher" title="Recolhe todas as conversas">Recolher</button>
          </div>

          <div id="itens-selecao" class="mrc-selecao hidden">
            <span id="selecao-contagem">0 selecionados</span>
            <button type="button" class="btn btn-secondary" id="btn-mover-selecao">Mover para…</button>
            <button type="button" class="btn btn-secondary" id="btn-remover-selecao">Remover do marcador</button>
            <button type="button" class="btn btn-secondary" id="btn-limpar-selecao">Limpar</button>
          </div>

          <div id="itens-loading" class="mrc-loading hidden" aria-hidden="true"></div>
          <div id="itens-erro" class="mrc-erro hidden">
            <span id="itens-erro-msg">Não foi possível carregar.</span>
            <button type="button" class="btn btn-secondary" id="btn-tentar-de-novo">Tentar de novo</button>
          </div>
          <div id="itens-corpo"></div>
          <p class="empty-hint" id="itens-vazio" style="display:none;">Nada marcado com esta etiqueta.</p>
          <button type="button" class="btn btn-secondary hidden" id="btn-limpar-filtros">Limpar busca e filtros</button>
        </section>

      </div>
    </main>
  </div>

</div>

<script src="vendor/jquery-3.7.1.min.js"></script>
<script src="js/utils/utils.js"></script>
<script src="js/utils/icones.js"></script>
<script src="js/utils/mapa_telas.js"></script>
<script src="js/utils/toast.js"></script>
<script src="js/utils/api.js"></script>
<script src="js/utils/carregando.js"></script>
<script src="js/utils/estados.js"></script>
<script src="js/utils/estado_url.js"></script>
<script src="js/utils/dialogo.js"></script>
<script src="js/utils/theme.js"></script>
<script src="js/utils/sidebar.js"></script>
<script src="js/utils/auth.js"></script>
<script src="js/utils/avisos_ia.js"></script>
<script src="js/utils/exportar_excel.js"></script>
<script src="js/utils/navegacao_inquerito.js"></script>
<script src="js/marcacoes.js"></script>
</body>
</html>
