<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Servidor · PolícIA</title>
<script src="js/utils/boot_tema.js"></script>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/servidor.css">
</head>
<body>
<div class="app">

  <div class="main">
    <header class="topbar">
      <h1 class="page-title">Servidor</h1>
    </header>

    <main class="content">
      <div class="card hidden" id="admin-card" style="max-width:none;">
        <div class="kpi-tiles">
          <div class="card kpi-tile">
            <div class="card-stat" id="kpi-cpu">—</div>
            <div class="card-stat-label" id="kpi-cpu-label">uso de CPU</div>
          </div>
          <div class="card kpi-tile">
            <div class="card-stat" id="kpi-memoria">—</div>
            <div class="card-stat-label" id="kpi-memoria-label">uso de memória</div>
          </div>
        </div>

        <div class="card" style="margin-top:16px; max-width:none;">
          <h2>Uso de disco</h2>
          <div id="kpi-discos"></div>
        </div>

        <div class="card" style="margin-top:16px; max-width:none;" id="versao-card">
          <h2>Versão e atualização</h2>

          <div class="versao-linha">
            <span class="versao-rotulo">Versão instalada</span>
            <strong id="versao-instalada">—</strong>
          </div>

          <div class="versao-linha">
            <span class="versao-rotulo">Migrações de banco</span>
            <span id="migracoes-estado">—</span>
            <button type="button" class="btn btn-secondary hidden" id="migracoes-aplicar-btn">Aplicar pendentes</button>
          </div>

          <div class="versao-linha">
            <span class="versao-rotulo">Atualização</span>
            <span id="atualizacao-estado">clique em Verificar</span>
            <button type="button" class="btn btn-secondary" id="atualizacao-verificar-btn">Verificar</button>
            <button type="button" class="btn btn-primary hidden" id="atualizacao-aplicar-btn">Atualizar</button>
          </div>

          <div id="atualizacao-notas" class="versao-notas hidden"></div>

          <div id="atualizacao-progresso" class="versao-notas hidden">
            <div class="versao-progresso-titulo" id="atualizacao-progresso-titulo">Atualizando…</div>
            <pre class="versao-notas-corpo" id="atualizacao-progresso-log"></pre>
          </div>
        </div>

        <p class="card-hint" id="kpi-atualizado" style="margin-top:16px;"></p>
      </div>

      <p class="empty-hint hidden" id="sem-permissao-hint">Esta página é só para administradores.</p>
    </main>
  </div>

</div>

<script src="vendor/jquery-3.7.1.min.js"></script>
<script src="js/utils/utils.js"></script>
<script src="js/utils/icones.js"></script>
<script src="js/utils/mapa_telas.js"></script>
<script src="js/utils/toast.js"></script>
<script src="js/utils/api.js"></script>
<script src="js/utils/carregando.js"></script>
<script src="js/utils/estados.js"></script>
<script src="js/utils/estado_url.js"></script>
<script src="js/utils/dialogo.js"></script>
<script src="js/utils/theme.js"></script>
<script src="js/utils/sidebar.js"></script>
<script src="js/utils/auth.js"></script>
<script src="js/utils/avisos_ia.js"></script>
<script src="js/servidor.js"></script>
</body>
</html>
