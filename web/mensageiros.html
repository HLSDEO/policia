<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conversas · PolícIA</title>
<script src="js/utils/boot_tema.js"></script>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/whatsapp.css">
<link rel="stylesheet" href="css/entidades.css">
<link rel="stylesheet" href="css/chat.css">
<link rel="stylesheet" href="css/ia_flutuante.css">
<link rel="stylesheet" href="css/marcacoes_flutuante.css">
</head>
<body>

<div class="wa-app">
  <aside class="wa-sidebar">
    <div class="wa-sidebar-header">
      <div class="wa-sidebar-topo">
        <div class="wa-avatar wa-avatar-app" id="wa-avatar-app">💬</div>
        <div class="wa-sidebar-titulos">
          <h1 id="wa-sidebar-titulo">Conversas</h1>
          <span id="wa-inquerito-label"></span>
        </div>
      </div>
      <div class="wa-busca">
        <span class="wa-busca-icone">🔍</span>
        <input type="text" id="wa-busca-input" placeholder="Pesquisar por nome ou número">
      </div>
    </div>
    <div class="wa-conversas" id="wa-conversas"></div>
  </aside>

  <div class="wa-main">
    <span class="extracao-nav-container" style="position:absolute;top:12px;right:16px;z-index:30;"></span>
    <div class="wa-main-header" id="wa-main-header"><span class="wa-main-header-vazio">Selecione uma conversa</span></div>
    <div class="wa-participantes hidden" id="wa-participantes"></div>
    <div class="wa-mensagens" id="wa-mensagens">
      <div class="wa-vazio">Selecione uma conversa à esquerda</div>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="modal-associacao">
  <div class="modal wa-modal-associacao">
    <div class="modal-header">
      <h2>Associar <span id="assoc-titulo"></span></h2>
      <button class="modal-close" id="assoc-fechar">&times;</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>Pessoa (base de referência)</label>
        <div class="wa-assoc-selecionado hidden" id="assoc-pessoa-selecionada"></div>
        <div class="wa-assoc-busca">
          <input type="text" id="assoc-pessoa-input" placeholder="Buscar por nome...">
          <div class="wa-assoc-resultados hidden" id="assoc-pessoa-resultados"></div>
        </div>
      </div>
      <div class="field">
        <label>Município</label>
        <div class="wa-assoc-selecionado hidden" id="assoc-municipio-selecionado"></div>
        <div class="wa-assoc-busca">
          <input type="text" id="assoc-municipio-input" placeholder="Buscar por nome...">
          <div class="wa-assoc-resultados hidden" id="assoc-municipio-resultados"></div>
        </div>
      </div>
      <div class="field">
        <label>Estado (use quando o município não for conhecido)</label>
        <select id="assoc-uf-select">
          <option value="">—</option>
        </select>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" id="assoc-salvar-btn">Salvar</button>
        <button class="btn btn-secondary" id="assoc-limpar-btn">Remover associação</button>
        <span class="form-status" id="assoc-status"></span>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="modal-midia">
  <div class="modal wa-modal-midia">
    <div class="modal-header">
      <h2 id="midia-titulo">Anexo</h2>
      <button class="modal-close" id="midia-fechar">&times;</button>
    </div>
    <div class="modal-body" id="midia-corpo"></div>
  </div>
</div>

<script src="vendor/jquery-3.7.1.min.js"></script>
<script src="js/utils/utils.js"></script>
<script src="js/utils/icones.js"></script>
<script src="js/utils/mapa_telas.js"></script>
<script src="js/utils/toast.js"></script>
<script src="js/utils/api.js"></script>
<script src="js/utils/carregando.js"></script>
<script src="js/utils/estados.js"></script>
<script src="js/utils/estado_url.js"></script>
<script src="js/utils/dialogo.js"></script>
<script src="js/utils/theme.js"></script>
<script src="js/utils/sidebar.js"></script>
<script src="js/utils/auth.js"></script>
<script src="js/utils/avisos_ia.js"></script>
<script src="js/utils/entidades.js"></script>
<script src="js/utils/navegacao_inquerito.js"></script>
<script src="js/utils/velocidade_midia.js"></script>
<script src="js/whatsapp.js"></script>
<script src="js/utils/doc_trecho.js"></script>
<script src="js/utils/evidencia_info.js"></script>
<script src="js/utils/ia_flutuante.js"></script>
<!-- depois de whatsapp.js: o sumário navega por window.WhatsAppUI, definido lá -->
<script src="js/marcacoes_flutuante.js"></script>
</body>
</html>
