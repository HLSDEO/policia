<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="js/utils/boot_tema.js"></script>
<title>Contas bancárias · PolícIA</title><link rel="icon" type="image/svg+xml" href="favicon.svg"><link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/ufdr.css"><link rel="stylesheet" href="css/entidades.css"><link rel="stylesheet" href="css/chat.css">
<link rel="stylesheet" href="css/arquivos.css"><link rel="stylesheet" href="css/ia_flutuante.css">
</head>
<body><div class="app"><div class="main" style="width:100%;"><header class="topbar"><h1 class="page-title">Contas bancárias e financeiras</h1><div class="topbar-actions"><span class="grupo-total" id="total-registros"></span><span class="extracao-nav-container"></span></div></header>
<main class="content"><div class="card" style="max-width:none;">
<div id="abas-host"></div>
<div id="painel-contas">
  <div class="arq-filtros filtros-painel">
    <div class="filtros-grade">
      <div class="filtro-campo filtro-campo-busca">
        <label class="filtro-rotulo" for="filtro-busca">Buscar</label>
        <input type="search" id="filtro-busca" class="arq-busca" placeholder="Instituição, titular, conta, agência…" autocomplete="off">
      </div>
      <div class="filtro-campo">
        <label class="filtro-rotulo" for="filtro-tipo">Categoria</label>
        <select id="filtro-tipo" class="arq-select"><option value="">Todas as categorias</option></select>
      </div>
      <div class="filtro-campo">
        <label class="filtro-rotulo" for="filtro-instituicao">Instituição</label>
        <select id="filtro-instituicao" class="arq-select"><option value="">Todas as instituições</option></select>
      </div>
      <div class="filtro-campo">
        <label class="filtro-rotulo" for="filtro-titular">Titular</label>
        <select id="filtro-titular" class="arq-select"><option value="">Todos os titulares</option></select>
      </div>
      <div class="filtro-campo">
        <label class="filtro-rotulo" for="filtro-fonte">Fonte</label>
        <select id="filtro-fonte" class="arq-select"><option value="">Todas as fontes</option></select>
      </div>
      <div class="filtro-campo">
        <label class="filtro-rotulo" for="filtro-moeda">Moeda</label>
        <select id="filtro-moeda" class="arq-select"><option value="">Todas as moedas</option></select>
      </div>
      <div class="filtro-campo">
        <label class="filtro-rotulo" for="filtro-saldo">Saldo</label>
        <select id="filtro-saldo" class="arq-select">
          <option value="">Qualquer saldo</option>
          <option value="informado">Com saldo informado</option>
          <option value="positivo">Saldo diferente de zero</option>
          <option value="sem">Sem saldo</option>
        </select>
      </div>
      <div class="filtro-campo">
        <label class="filtro-rotulo" for="filtro-situacao">Situação no aparelho</label>
        <select id="filtro-situacao" class="arq-select">
          <option value="">Íntegras e apagadas</option>
          <option value="apagados">Só apagadas/recuperadas</option>
          <option value="intactos">Só íntegras</option>
        </select>
      </div>
    </div>
    <div class="filtros-rodape">
      <label class="arq-check"><input type="checkbox" id="filtro-marcadas"> Só as marcadas para o relatório</label>
      <span class="filtro-dica" id="filtro-resumo"></span>
      <button type="button" class="btn btn-secondary filtro-limpar" id="filtro-limpar" style="display:none;">Limpar filtros</button>
    </div>
  </div>
  <div style="overflow-x:auto;"><table class="grupo-tabela" id="dados-tabela" data-exportar="contas_financeiras"><thead><tr id="dados-cabecalho"></tr></thead><tbody id="dados-corpo"></tbody></table></div>
  <p class="empty-hint" id="dados-vazio" style="display:none;">Nenhuma conta financeira encontrada no UFDR.</p>
</div>
    </div></main>
</div></div><script src="vendor/jquery-3.7.1.min.js"></script>
<script src="js/utils/utils.js"></script>
<script src="js/utils/icones.js"></script>
<script src="js/utils/mapa_telas.js"></script>
<script src="js/utils/toast.js"></script>
<script src="js/utils/api.js"></script>
<script src="js/utils/carregando.js"></script>
<script src="js/utils/estados.js"></script>
<script src="js/utils/estado_url.js"></script>
<script src="js/utils/dialogo.js"></script><script src="js/utils/theme.js"></script><script src="js/utils/sidebar.js"></script><script src="js/utils/auth.js"></script><script src="js/utils/avisos_ia.js"></script><script src="js/utils/entidades.js"></script><script src="js/utils/exportar_excel.js"></script><script src="js/utils/navegacao_inquerito.js"></script>
<script src="js/utils/velocidade_midia.js"></script>
<script src="js/utils/ufdr_dominio.js"></script><script src="js/contas_financeiras.js"></script>
<script src="js/utils/doc_trecho.js"></script>
<script src="js/utils/evidencia_info.js"></script>
<script src="js/utils/ia_flutuante.js"></script>
</body></html>
