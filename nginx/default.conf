# Cache de tiles do OpenStreetMap servidos pelo proxy /osm-tiles/ do server abaixo.
# Fica em http level porque proxy_cache_path só pode ser declarado fora de server{}.
# use_temp_path=off entrega direto do arquivo final da cache (sem cópia temporária).
proxy_cache_path /var/cache/nginx/osm-tiles levels=1:2 keys_zone=osm_tiles:10m
                 max_size=1g inactive=7d use_temp_path=off;

# Pool de conexões keep-alive com a API. Sem este bloco (era um proxy_pass direto para
# http://api:3000) cada requisição de cada analista abria e fechava uma conexão TCP nova com o
# uvicorn: com trinta pessoas clicando, é handshake e TIME_WAIT à toa o dia inteiro. `keepalive`
# só funciona junto com o `proxy_http_version 1.1` + `proxy_set_header Connection ""` lá embaixo —
# sem limpar o header, o "Connection: close" do cliente é repassado e a conexão morre a cada uso.
# As duas réplicas da API (api-1/api-2 no docker-compose.yml). Round-robin puro: a API é
# sem estado (sessões, jobs e filas vivem no Postgres), então qualquer réplica atende
# qualquer pedido e NÃO precisa de ip_hash/afinidade. `max_fails`+`fail_timeout` marcam a
# réplica morta por 15 s (o nginx para de tentar enquanto ela não voltar); a requisição em
# curso na réplica que cai é reenviada à outra nos casos de conexão recusada/timeout
# (proxy_next_upstream padrão — POST de upload NÃO é reenviado, para não duplicar corpo).
# `keepalive 32` exige proxy_http_version 1.1 + Connection "" em cada location (já há).
upstream analyser_api {
    server api-1:3000 max_fails=3 fail_timeout=15s;
    server api-2:3000 max_fails=3 fail_timeout=15s;
    keepalive 32;
}

# Túnel NAT (docs/no_descentralizado.md): o serviço `tunel` é o relay HTTP↔WebSocket por onde o
# central alcança nós atrás de NAT. Processo único, sem keepalive — cada nó segura UMA conexão
# WebSocket de longa duração aqui, e a API chega por rede interna direto (não passa por nginx).
upstream analyser_tunel {
    server tunel:3001;
}

# $connection_upgrade: "upgrade" para o handshake WebSocket dos nós, "close" para o HTTP normal
# da superfície /tunel/ (saúde, replay de pedidos). O nginx não tem esse map embutido — é a
# receita padrão de proxy de WebSocket da própria documentação.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Redirect HTTP -> HTTPS dos hostnames (achado de pentest: login e cookie de sessão trafegavam
# em HTTP puro). Estes dois blocos casam só com os dois nomes; o bloco da aplicação abaixo é o
# default_server da porta 80, então acesso por IP (10.27.7.19 e o temporário 172.27.5.49) nunca
# casa aqui e continua servindo HTTP, sem redirect. Assim nenhum POST máquina-a-máquina (nó
# descentralizado, scripts) é quebrado pelo 301 — que converte POST em GET.
#
# O destino é o FQDN fixo (não $host) de propósito: ecoar o Host faria um Host forjado virar
# open redirect. HSTS não é ativado de propósito: ligado, ele prende o navegador ao HTTPS pelo
# max-age inteiro e derruba os acessos por IP/temporário sem aviso.
server {
    listen 80;
    server_name policia-es.pf.gov.br;
    server_tokens off;
    return 301 https://policia-es.pf.gov.br$request_uri;
}

server {
    listen 80;
    server_name policia-es;
    server_tokens off;
    return 301 https://policia-es.pf.gov.br$request_uri;
}

server {
    listen 80 default_server;
    listen 443 ssl;
    server_name _;
    charset utf-8;

    # TLS: certificado institucional extraído de nginx/policia-es.pfx (arquivo não versionado;
    # a chave em nginx/ssl/ também não — ver .gitignore). O fullchain traz o certificado da
    # folha + a cadeia emissora (PF SUBORDINATE CA 01), para o cliente não depender de
    # buscar o intermediário sozinho. A chave está SEM senha (-nodes) de propósito: com
    # senha, o nginx pediria a passphrase a cada start/reload e o container não subiria.
    ssl_certificate /etc/nginx/ssl/policia-es-fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/policia-es.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    root /usr/share/nginx/html;
    index index.html;
    charset_types text/css text/plain application/javascript application/json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        # cópia idêntica da CSP do nível server (add_header em location anula os do herdados)
        # worker-src: o pdf.js (web/vendor/pdfjs) roda o parser do PDF num Worker da MESMA origem;
        # blob: cobre o reserva dele, que reempacota o worker num blob quando o navegador não
        # consegue instanciar o arquivo direto. Nada de origem externa entra aqui.
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; worker-src 'self' blob:" always;

    # Achaque de reconhecimento (pentest): sem esta linha o nginx responde `Server: nginx/x.y.z`
    # e assina as próprias páginas de erro HTML com nome + versão — um convite para procurar
    # CVE da versão. Com `off`, sobe só `Server: nginx` (a imagem oficial não traz o módulo
    # headers-more, então apagar o header inteiro não é possível sem recompilar; esconder a
    # versão é o que o achado pede). As páginas de erro nomeadas abaixo escondem até o nome.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 512;

    # Tamanho máximo de corpo aceito. Sem esta linha vale o default do nginx, que é 1 MB — e a
    # comparação facial ficava QUEBRADA por isso: api/rotas/comparar_rosto.py:25 declara
    # MAX_TAMANHO_UPLOAD = 10 MB, mas uma foto de celular passa de 1 MB com folga, então o envio
    # morria no nginx antes de chegar na API, com um 413 em HTML que o front nem sabe ler.
    #
    # Quem manda no limite é cada rota; isto aqui é só a rede de proteção, e fica ACIMA do
    # maior limite de aplicação de propósito — assim quem recusa é a API, com mensagem em JSON
    # que a tela sabe ler, e não o proxy com um 413 opaco. Os limites de aplicação hoje:
    #
    #   até 500 MB · POST /api/documentos/upload — envio de documento pelo navegador na aba
    #           "Arquivo genérico" (UPLOAD_DOCUMENTO_MB, ajustável em Administração → Desempenho;
    #           padrão 50 MB, em funcoes/documentos_utils.py). É o maior, e é dele que sai o 520m
    #           abaixo (500 MB + margem para multipart). O teto da tela é 500 MB justamente para
    #           continuar cabendo aqui; subir um pede subir o outro junto + reload do nginx.
    #           O mesmo teto por arquivo vale para os uploads do SIMBA (/api/investigacao/
    #           simba-upload) e da pasta do RIF (/api/investigacao/rif-upload, que manda a pasta
    #           inteira num multipart só — uma pasta de RIF realista fica muito abaixo disto).
    #   10 MB · POST /api/comparar-rosto (MAX_TAMANHO_UPLOAD, em rotas/comparar_rosto.py) — segue
    #           recusando no seu próprio limite, com a mensagem dele.
    #
    # EXCEÇÕES: POST /api/investigacao/ufdr-upload (envio de .ufdr pelo navegador, na aba
    # "Indexação Cellebrite") e POST /api/documentos/upload-zip (envio de .zip de prova na
    # aba "Arquivo genérico") não passam por este teto — um .ufdr tem dezenas de GB e um ZIP
    # de prova com centenas de documentos passa de GB. Eles têm um `location` exato próprio
    # cada um logo abaixo, com client_max_body_size 0 e proxy_request_buffering
    # off: sem o buffering desligado, o nginx bufferizaria o arquivo inteiro em disco antes
    # de repassar à API. As rotas gravam em blocos (salvar_ufdr_enviado /
    # _salvar_documento_zip), sem passar o corpo pela memória do processo.
    #
    # Por que não um valor bem mais alto: POST /api/investigacao/extracoes/{id}/restaurar-arquivo/upload
    # (investigacao.py) fazia `arquivo.file.read()` — carregava o arquivo INTEIRO na memória do
    # processo, e um .ufdr passa de dezenas de GB. Com o teto aqui, o estrago é limitado a um corpo;
    # liberar o corpo de vez para TODAS as rotas deixaria esse perfil voltar a ser possível. A
    # rota hoje grava em blocos (restaurar_arquivo_ufdr_upload), e o upload de documento nunca teve
    # esse problema (salvar_documento_enviado) — mesmo assim, só os `location` exatos do upload
    # de .ufdr e do upload de .zip furam o teto, e de propósito.
    #
    # O envio de vários documentos de uma vez é feito UM ARQUIVO POR REQUISIÇÃO no front
    # (web/js/importacao.js) justamente para caber aqui — cinco arquivos grandes numa requisição
    # só bateriam neste teto. O .zip vai por rota própria (location abaixo), sem teto. A exceção
    # é a pasta do RIF, que vai num multipart só (poucos arquivos, todos dentro do teto por
    # arquivo da API).
    client_max_body_size 520m;

    # O front lê a mensagem de erro sempre de xhr.responseJSON.detail (ver web/js/utils/api.js).
    # A página de erro padrão do nginx é HTML: sem isto, estourar o limite mostra "Ocorreu um erro"
    # genérico em vez de dizer que o arquivo é grande demais. A mensagem é genérica de propósito:
    # o limite real é ajustável em Desempenho, e o nginx não sabe qual valor está vigente.
    error_page 413 = @erro_413;
    location @erro_413 {
        default_type application/json;
        return 413 '{"detail":"Arquivo grande demais para o limite de envio configurado (ajustável em Administração → Desempenho)."}';
    }

    # Páginas de erro do próprio nginx (404 de arquivo estático, 502/504 com a API fora do ar,
    # 405, 500) saem por padrão em HTML assinado com "nginx/x.y.z" no rodapé. Além do
    # server_tokens acima, cada status ganha um corpo JSON próprio — no formato {"detail": ...}
    # que o front já lê (xhr.responseJSON.detail, ver web/js/utils/api.js) — sem nome nem versão
    # de software. O status real é preservado em cada `return`.
    error_page 404 = @erro_404;
    location @erro_404 {
        default_type application/json;
        return 404 '{"detail":"Não encontrado."}';
    }
    error_page 405 = @erro_405;
    location @erro_405 {
        default_type application/json;
        return 405 '{"detail":"Método não permitido."}';
    }
    error_page 500 = @erro_500;
    location @erro_500 {
        default_type application/json;
        return 500 '{"detail":"Erro interno do servidor."}';
    }
    error_page 502 = @erro_502;
    location @erro_502 {
        default_type application/json;
        return 502 '{"detail":"O serviço não está respondendo no momento. Tente de novo em alguns instantes."}';
    }
    error_page 503 = @erro_503;
    location @erro_503 {
        default_type application/json;
        return 503 '{"detail":"O sistema está indisponível no momento. Tente de novo em alguns instantes."}';
    }
    error_page 504 = @erro_504;
    location @erro_504 {
        default_type application/json;
        return 504 '{"detail":"A requisição demorou mais do que o limite e foi interrompida. Tente de novo."}';
    }

    # sem build step/hash no nome do arquivo — sem isso o navegador guarda uma cópia antiga
    # do JS/CSS/HTML e não busca a nova mesmo depois de editar (visto na prática: aba nova, sem
    # nenhum cache aparente, ainda rodava um auth.js de antes de um fix; depois, um
    # configuracoes.html velho sem os campos novos). no-cache não
    # desliga o cache, só obriga revalidar (If-None-Match) a cada carga — normalmente vira
    # 304 rápido, e pega a mudança na hora quando o arquivo muda de verdade.
    # Atenção à herança do nginx: um `add_header` em qualquer `location` ANULA todos os do nível
    # `server`. Sem repetir as diretivas de segurança aqui, as páginas e assets entregues ao
    # usuário (html/js/css) ficavam sem CSP, X-Frame-Options, nosniff e Referrer-Policy — o
    # achado IV.3 do pentest.
    location ~* \.(js|css|html)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    # img-src voltou a ser só 'self': os tiles do Leaflet agora vêm pelo proxy local
    # /osm-tiles/ (ver location abaixo), então o navegador não fala mais direto com o OSM.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; worker-src 'self' blob:" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Túnel NAT (docs/no_descentralizado.md): É por aqui que os NÓS chegam ao serviço `tunel`
    # (wss://<central>/tunel/ws/node). ^~ para nenhuma location regex (js/css/html) desviar o
    # caminho. Timeout de 1 h em ambas as direções: o cano é de LONGA duração e fica ocioso entre
    # pedidos — sem proxy_read_timeout longo o nginx derrubava o WebSocket a cada 60 s e o nó
    # reconectava em loop. Corpo sem teto nem buffering: o relay repassa uploads de GB em
    # streaming (mesmo desenho do location do .ufdr abaixo).
    location ^~ /tunel/ {
        proxy_pass http://analyser_tunel;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://analyser_api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Diz à API se a requisição chegou por HTTP ou HTTPS no nginx. É o que decide o flag
        # Secure do cookie de sessão (auth_utils.chegou_https). Confiável porque a API não tem
        # porta publicada no host — o único caminho até ela é este proxy, que SEMPRE sobrescreve
        # o cabeçalho (proxy_set_header substitui, não anexa), então cliente nenhum forja.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        # exigido pelo `keepalive` do upstream: sem isto o nginx repassa o "Connection: close"
        # do cliente e a conexão com a API é descartada depois de uma requisição só
        proxy_set_header Connection "";

        # Defesa em profundidade contra o achado de divulgação de versão: o uvicorn responde
        # `Server: uvicorn`; o nginx normalmente já descarta o Server do upstream, mas esconder
        # aqui garante que nenhum header de identificação (Server, X-Powered-By) passe pelo proxy
        # se o comportamento ou o servidor mudar.
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;

        # Sem estas três linhas valia o default de 60 s do nginx, e qualquer rota mais lenta que
        # isso (relatório, grafo, timeline, busca semântica) virava 504 numa PÁGINA HTML de erro
        # — que o front não sabe ler, porque ele só olha xhr.responseJSON.detail. O teto de tempo
        # de verdade agora é o statement_timeout do banco (60 s, em funcoes/db_utils.py), que
        # devolve 504 em JSON com mensagem; estes 300 s existem só para o nginx não cortar antes
        # e trocar uma mensagem boa por uma ruim.
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Listagem dos documentos do inquérito (GET .../inqueritos/{id}/documentos — a rota do card
    # "Documentos" em investigacao.html). Vista no Firefox com inquérito de 503 documentos:
    # "JSON.parse: unterminated string" + o toast "Sem conexão com o servidor" da rede de segurança
    # de utils/api.js (xhr.status 0 = conexão morta no MEIO do corpo, não servidor fora do ar).
    # Causa raiz (vista no log do próprio nginx): "mkdir() /var/cache/nginx/proxy_temp/... failed
    # (28: No space left on device)" — o / do host encheu e o nginx, com o buffering ligado (padrão),
    # grava a resposta de ~3 MB em disco antes de entregar; sem espaço ele corta o corpo no meio e o
    # navegador recebe JSON truncado. Além de liberar disco, esta location tira a rota do caminho
    # que grava em disco:
    #  - proxy_buffering off: o navegador recebe os bytes direto conforme a API os produz;
    #  - gzip desligado: sem a compactação não há etapa intermediária em memória/cache no nginx.
    # proxy_pass sem URI = repassa a URI original intacta. As diretivas de proxy_* NÃO são herdadas
    # do bloco /api/ (nginx não herda de outros location) — por isso repetem aqui.
    location ~ ^/api/investigacao/inqueritos/[0-9]+/documentos$ {
        proxy_pass http://analyser_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        proxy_buffering off;
        gzip off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Tiles do mapa (Leaflet: grafo de localizações e timeline) servidos pela MESMA origem:
    # o navegador não fala mais direto com o OSM — quem fala é este servidor, com User-Agent
    # que identifica o app, como exige a política de uso dos tiles
    # (https://tile.openstreetmap.org/rules.pt-br.html). O OSM vinha devolvendo os tiles de
    # "Access blocked" porque via o Analyser como app desconhecido pedindo os mesmos tiles
    # de muitos analistas; com o cache de 7 dias o tráfego duplicado desaparece e a CSP
    # pode voltar a ser img-src 'self' (nenhum domínio externo no navegador).
    location ^~ /osm-tiles/ {
        # hostname em variável + resolver: resolve o DNS em tempo de requisição (o DNS interno
        # do Docker, 127.0.0.11) em vez de fixar o IP na carga da config, como faz o upstream
        # proxy_pass com nome resolvido no boot.
        resolver 127.0.0.11 valid=1h ipv6=off;
        set $osm_upstream https://tile.openstreetmap.org;
        rewrite ^/osm-tiles/(.*)$ /$1 break;
        proxy_pass $osm_upstream;
        proxy_ssl_server_name on;
        proxy_set_header Host tile.openstreetmap.org;
        proxy_set_header User-Agent "AnalyserPF/1.0 (aplicativo interno da Policia Federal; policia-es.pf.gov.br)";
        proxy_set_header Referer "";
        proxy_cache osm_tiles;
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 10m;
        # serve o tile velho enquanto busca um novo (ou quando o OSM está fora): o mapa nunca
        # fica com buraco cinza por uma instabilidade momentânea do link
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Upload de .ufdr pelo navegador (aba "Indexação Cellebrite" da tela Nova importação) — o
    # primeiro envio que fura o client_max_body_size global acima. Sem teto de corpo e com o
    # request buffering DESLIGADO: com ele ligado (default), o nginx seguraria os dezenas de GB
    # inteiros em disco antes de repassar à API — duas cópias do arquivo no servidor e a API só
    # vendo a requisição depois do upload terminar. Os timeouts longos existem porque um link
    # lento pode legitimamente levar horas entre leituras sucessivas do corpo (client_body_timeout
    # e proxy_send_timeout contam entre blocos, não o total). Quem valida o que sobe é a rota
    # (só .ufdr, gravação em blocos por salvar_ufdr_enviado).
    location = /api/investigacao/ufdr-upload {
        client_max_body_size 0;
        proxy_request_buffering off;
        client_body_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_pass http://analyser_api/api/investigacao/ufdr-upload;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # idem /api/: não repassar Server/X-Powered-By do upstream (oculta a versão)
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
    }

    # Upload de .zip de prova pelo navegador (aba "Arquivo genérico" da tela Nova importação
    # e modal "+ Importar") — o segundo envio que fura o client_max_body_size global acima,
    # pelo mesmo motivo do .ufdr: um ZIP com centenas de documentos passa de GB, então o
    # teto de UPLOAD_DOCUMENTO_MB não vale aqui (ver _salvar_documento_zip em
    # funcoes/documentos_utils.py). Mesmo desenho do location do .ufdr: sem teto de corpo
    # e sem bufferizar o arquivo inteiro em disco antes de repassar à API. Quem valida o
    # que sobe é a rota (só .zip; as travas anti-zip-bomb continuam valendo).
    location = /api/documentos/upload-zip {
        client_max_body_size 0;
        proxy_request_buffering off;
        client_body_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_pass http://analyser_api/api/documentos/upload-zip;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # idem /api/: não repassar Server/X-Powered-By do upstream (oculta a versão)
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
    }
}
