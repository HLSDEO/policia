# Configuração do nginx PARA O OPENSHIFT (imagem Dockerfile.web, porta 8080).
# Derivada do default.conf do docker-compose; diferenças:
#  - listen 8080 (nginx-unprivileged; a Route do OpenShift termina o TLS e fala HTTP aqui);
#  - sem blocos de redirect HTTP->HTTPS nem ssl_certificate (TLS termination na Route);
#  - upstream único `api:3000` (Service da API; a escala é feito por réplicas do Deployment,
#    não por dois nomes fixos api-1/api-2 como no compose);
#  - X-Forwarded-Proto repassa o header que o ROUTER (HAProxy) já definiu — $scheme aqui
#    seria sempre http (o TLS termina antes), o que desligaria o flag Secure do cookie.
# Cache de tiles do OpenStreetMap (proxy /osm-tiles/). proxy_cache_path só pode ser
# declarado fora de server{} — o arquivo é incluído no contexto http do nginx.
proxy_cache_path /var/cache/nginx/osm-tiles levels=1:2 keys_zone=osm_tiles:10m
                 max_size=1g inactive=7d use_temp_path=off;

# keep-alive com a API: exige proxy_http_version 1.1 + Connection "" em cada location.
upstream analyser_api {
    server api:3000 max_fails=3 fail_timeout=15s;
    keepalive 32;
}

# Túnel NAT (docs/no_descentralizado.md): relay HTTP<->WebSocket. Processo único.
upstream analyser_tunel {
    server tunel:3001;
}

# $connection_upgrade: "upgrade" para o WebSocket dos nós, "close" para o HTTP normal.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080 default_server;
    server_name _;
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;
    charset_types text/css text/plain application/javascript application/json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; worker-src 'self' blob:" always;

    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 512;

    # Tetos e exceções de upload: ver comentários longos no default.conf (compose).
    # Quem manda no limite é cada rota; isto é rede de proteção ACIMA do maior limite
    # de aplicação (500 MB de UPLOAD_DOCUMENTO_MB). As exceções sem teto (ufdr-upload,
    # upload-zip) têm location próprio abaixo.
    client_max_body_size 520m;

    # Páginas de erro em JSON no formato {"detail": ...} que o front lê
    # (xhr.responseJSON.detail, web/js/utils/api.js).
    error_page 413 = @erro_413;
    location @erro_413 {
        default_type application/json;
        return 413 '{"detail":"Arquivo grande demais para o limite de envio configurado (ajustável em Administração → Desempenho)."}';
    }
    error_page 404 = @erro_404;
    location @erro_404 {
        default_type application/json;
        return 404 '{"detail":"Não encontrado."}';
    }
    error_page 405 = @erro_405;
    location @erro_405 {
        default_type application/json;
        return 405 '{"detail":"Método não permitido."}';
    }
    error_page 500 = @erro_500;
    location @erro_500 {
        default_type application/json;
        return 500 '{"detail":"Erro interno do servidor."}';
    }
    error_page 502 = @erro_502;
    location @erro_502 {
        default_type application/json;
        return 502 '{"detail":"O serviço não está respondendo no momento. Tente de novo em alguns instantes."}';
    }
    error_page 503 = @erro_503;
    location @erro_503 {
        default_type application/json;
        return 503 '{"detail":"O sistema está indisponível no momento. Tente de novo em alguns instantes."}';
    }
    error_page 504 = @erro_504;
    location @erro_504 {
        default_type application/json;
        return 504 '{"detail":"A requisição demorou mais do que o limite e foi interrompida. Tente de novo."}';
    }

    # no-cache em js/css/html: revalida sempre (304 rápido) — sem isso o navegador
    # roda JS/CSS velho depois de um deploy.
    # add_header em location ANULA os do nível server — por isso a repetição aqui.
    location ~* \.(js|css|html)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; worker-src 'self' blob:" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Túnel NAT: wss://<host>/tunel/ws/node. WebSocket de longa duração (1 h de
    # timeout nas duas pontas) e streaming de corpo sem teto.
    location ^~ /tunel/ {
        proxy_pass http://analyser_tunel;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://analyser_api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # No OpenShift o TLS termina na Route: $scheme seria sempre http aqui. O header
        # que o ROUTER define (e sobrescreve qualquer valor do cliente) é o que a API
        # precisa para decidir o flag Secure do cookie (auth_utils.chegou_https).
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Listagem de documentos sem buffering nem gzip (respostas de MB): ver comentário
    # no default.conf (proxy_buffering encheu o disco e truncou o JSON no navegador).
    location ~ ^/api/investigacao/inqueritos/[0-9]+/documentos$ {
        proxy_pass http://analyser_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        proxy_buffering off;
        gzip off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Tiles do OSM pela MESMA origem (política de uso + CSP img-src 'self' + cache 7 d).
    # No OpenShift o resolver é o DNS do cluster (openshift-dns; ClusterIP padrão
    # 172.30.0.10 — confirme o serviceNetworkCIDR do seu cluster e ajuste se preciso).
    location ^~ /osm-tiles/ {
        resolver 172.30.0.10 valid=1h ipv6=off;
        set $osm_upstream https://tile.openstreetmap.org;
        rewrite ^/osm-tiles/(.*)$ /$1 break;
        proxy_pass $osm_upstream;
        proxy_ssl_server_name on;
        proxy_set_header Host tile.openstreetmap.org;
        proxy_set_header User-Agent "AnalyserPF/1.0 (aplicativo interno da Policia Federal; policia-es.pf.gov.br)";
        proxy_set_header Referer "";
        proxy_cache osm_tiles;
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 10m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Upload de .ufdr (dezenas de GB): sem teto de corpo, sem buffering, timeouts de 1 h.
    location = /api/investigacao/ufdr-upload {
        client_max_body_size 0;
        proxy_request_buffering off;
        client_body_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_pass http://analyser_api/api/investigacao/ufdr-upload;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
    }

    # Upload de .zip de prova (GB): mesmo desenho do .ufdr.
    location = /api/documentos/upload-zip {
        client_max_body_size 0;
        proxy_request_buffering off;
        client_body_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_pass http://analyser_api/api/documentos/upload-zip;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
    }
}
