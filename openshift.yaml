apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: nginx-conf
      labels:
        app: pf-policia-dev
    data:
      default.conf: |
        server {
          listen 8080;
          server_name _;

          location / {
            root /usr/share/nginx/html;
            index index.html;
          }

          location /api/ {
            proxy_pass http://policia:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
          }
        }
      index.html: |
        <!DOCTYPE html>
        <html lang="pt-br">
        <head>
          <meta charset="UTF-8">
          <title>Teste OpenShift</title>
          <style>
            body { font-family: sans-serif; max-width: 640px; margin: 40px auto; }
            input { padding: 8px; width: 70%; }
            button { padding: 8px 16px; cursor: pointer; }
            table { border-collapse: collapse; width: 100%; margin-top: 20px; }
            th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
            #msg { color: green; } #erro { color: red; }
          </style>
        </head>
        <body>
          <h1>Cadastro de Itens</h1>
          <form id="form">
            <input id="nome" placeholder="Nome do item" required>
            <button type="submit">Inserir</button>
          </form>
          <p id="msg"></p><p id="erro"></p>
          <table>
            <thead><tr><th>ID</th><th>Nome</th></tr></thead>
            <tbody id="lista"></tbody>
          </table>
          <script>
            const api = '/api';
            async function listar() {
              const r = await fetch(api + '/items');
              const d = await r.json();
              document.getElementById('lista').innerHTML =
                d.itens.map(i => `<tr><td>${i.id}</td><td>${i.nome}</td></tr>`).join('');
            }
            document.getElementById('form').addEventListener('submit', async (e) => {
              e.preventDefault();
              document.getElementById('msg').textContent = '';
              document.getElementById('erro').textContent = '';
              try {
                const nome = document.getElementById('nome').value;
                const r = await fetch(api + '/items', {
                  method: 'POST',
                  headers: {'Content-Type': 'application/json'},
                  body: JSON.stringify({nome})
                });
                if (!r.ok) throw new Error(await r.text());
                document.getElementById('nome').value = '';
                document.getElementById('msg').textContent = 'Inserido com sucesso!';
                listar();
              } catch (err) {
                document.getElementById('erro').textContent = 'Erro: ' + err.message;
              }
            });
            listar();
          </script>
        </body>
        </html>
  - apiVersion: v1
    kind: Service
    metadata:
      name: web
      labels:
        app: pf-policia-dev
    spec:
      selector:
        app: pf-policia-dev
        component: nginx
      ports:
        - name: http
          port: 8080
          targetPort: 8080
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: nginx
      labels:
        app: pf-policia-dev
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: pf-policia-dev
          component: nginx
      template:
        metadata:
          labels:
            app: pf-policia-dev
            component: nginx
        spec:
          containers:
            - name: nginx
              image: docker.io/nginxinc/nginx-unprivileged:1.27-alpine
              ports:
                - containerPort: 8080
              volumeMounts:
                - name: conf
                  mountPath: /etc/nginx/conf.d
                - name: conf
                  mountPath: /usr/share/nginx/html/index.html
                  subPath: index.html
          volumes:
            - name: conf
              configMap:
                name: nginx-conf
  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      name: web
      labels:
        app: pf-policia-dev
    spec:
      to:
        kind: Service
        name: web
        weight: 100
      port:
        targetPort: http
  - apiVersion: v1
    kind: Service
    metadata:
      name: postgres
      labels:
        app: pf-policia-dev
    spec:
      selector:
        app: pf-policia-dev
        component: postgres
      ports:
        - name: postgres
          port: 5432
          targetPort: 5432
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: postgres
      labels:
        app: pf-policia-dev
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: pf-policia-dev
          component: postgres
      strategy:
        type: Recreate
      template:
        metadata:
          labels:
            app: pf-policia-dev
            component: postgres
        spec:
          containers:
            - name: postgres
              image: registry.redhat.io/rhel9/postgresql-16:latest
              ports:
                - containerPort: 5432
              env:
                - name: POSTGRESQL_DATABASE
                  value: appdb
                - name: POSTGRESQL_USER
                  value: appuser
                - name: POSTGRESQL_PASSWORD
                  value: apppass
              volumeMounts:
                - name: data
                  mountPath: /var/lib/pgsql/data
              readinessProbe:
                exec:
                  command: ["pg_isready", "-U", "appuser"]
                initialDelaySeconds: 5
          volumes:
            - name: data
              emptyDir: {}
