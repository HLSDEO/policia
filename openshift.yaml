apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: Service
    metadata:
      name: api
      labels:
        app: pf-policia-dev
    spec:
      selector:
        app: pf-policia-dev
        component: api
      ports:
        - name: http
          port: 8000
          targetPort: 8000
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: api
      labels:
        app: pf-policia-dev
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: pf-policia-dev
          component: api
      strategy:
        type: RollingUpdate
      template:
        metadata:
          labels:
            app: pf-policia-dev
            component: api
        spec:
          containers:
            - name: api
              image: api:latest
              ports:
                - containerPort: 8000
              env:
                - name: DB_HOST
                  value: postgres
                - name: DB_PORT
                  value: "5432"
                - name: DB_NAME
                  value: appdb
                - name: DB_USER
                  value: appuser
                - name: DB_PASSWORD
                  value: apppass
              readinessProbe:
                httpGet:
                  path: /health
                  port: 8000
                initialDelaySeconds: 5
              livenessProbe:
                httpGet:
                  path: /health
                  port: 8000
                initialDelaySeconds: 15
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: nginx-conf
      labels:
        app: pf-policia-dev
    data:
      default.conf: |
        server {
          listen 8080;
          server_name _;

          location / {
            default_type text/html;
            return 200 '<h1>NGINX OK</h1><p>Proxy /api -> FastAPI</p>';
          }

          location /api/ {
            proxy_pass http://api:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
          }
        }
  - apiVersion: v1
    kind: Service
    metadata:
      name: web
      labels:
        app: pf-policia-dev
    spec:
      selector:
        app: pf-policia-dev
        component: nginx
      ports:
        - name: http
          port: 8080
          targetPort: 8080
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: nginx
      labels:
        app: pf-policia-dev
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: pf-policia-dev
          component: nginx
      strategy:
        type: RollingUpdate
      template:
        metadata:
          labels:
            app: pf-policia-dev
            component: nginx
        spec:
          containers:
            - name: nginx
              image: nginx:1.24-ubi9
              ports:
                - containerPort: 8080
              volumeMounts:
                - name: conf
                  mountPath: /etc/nginx/conf.d
          volumes:
            - name: conf
              configMap:
                name: nginx-conf
  - apiVersion: v1
    kind: Service
    metadata:
      name: postgres
      labels:
        app: pf-policia-dev
    spec:
      selector:
        app: pf-policia-dev
        component: postgres
      ports:
        - name: postgres
          port: 5432
          targetPort: 5432
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: postgres
      labels:
        app: pf-policia-dev
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: pf-policia-dev
          component: postgres
      strategy:
        type: Recreate
      template:
        metadata:
          labels:
            app: pf-policia-dev
            component: postgres
        spec:
          containers:
            - name: postgres
              image: registry.redhat.io/rhel8/postgresql-15:latest
              ports:
                - containerPort: 5432
              env:
                - name: POSTGRESQL_DATABASE
                  value: appdb
                - name: POSTGRESQL_USER
                  value: appuser
                - name: POSTGRESQL_PASSWORD
                  value: apppass
              volumeMounts:
                - name: data
                  mountPath: /var/lib/pgsql/data
              readinessProbe:
                exec:
                  command: ["pg_isready", "-U", "appuser"]
                initialDelaySeconds: 5
          volumes:
            - name: data
              emptyDir: {}
  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      name: app
      labels:
        app: pf-policia-dev
    spec:
      path: /
      to:
        kind: Service
        name: web
        weight: 100
      port:
        targetPort: http
  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      name: api
      labels:
        app: pf-policia-dev
    spec:
      path: /api
      to:
        kind: Service
        name: api
        weight: 100
      port:
        targetPort: http
